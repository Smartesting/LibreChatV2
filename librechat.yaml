# For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.3.11

# Cache settings: Set to true to enable caching
cache: true

# Custom interface configuration
interface:
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  marketplace:
    use: false
  fileCitations: true

# Definition of custom endpoints
endpoints:
  custom:
    # OpenRouter
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: "https://openrouter.ai/api/v1"

      models:
        # See all available models at https://openrouter.ai/models
        default:
          # OpenAI
          - "openai/gpt-6.1-sol"
          - "openai/gpt-6.1-terra"
          - "openai/gpt-5.6-luna"

          # Anthropic
          - "anthropic/claude-sonnet-5.5"
          - "anthropic/claude-haiku-5.5"

          # Mistral AI
          - "mistralai/mistral-medium-3-5"
          - "mistralai/mistral-small-2603"
          - "mistralai/codestral-2508"

          # DeepSeek
          - "deepseek/deepseek-v4.1-flash-1017"
          - "deepseek/deepseek-v4-pro-0813"

          # Google
          - "google/gemini-3.8-flash"
          - "google/gemini-3.5-flash-lite"

        fetch: false

      titleConvo: true
      titleModel: "openai/gpt-5.6-luna"

      dropParams:
        - "stop"

# Display names for the models served through OpenRouter
modelSpecs:
  prioritize: true
  addedEndpoints:
    - agents
  list:
    # OpenAI
    - name: "openrouter-gpt-6-1-sol"
      label: "GPT-6.1 Sol"
      iconURL: "/assets/openai-color.svg"
      group: "OpenAI"
      groupIcon: "openAI"
      preset:
        endpoint: "OpenRouter"
        model: "openai/gpt-6.1-sol"
        modelLabel: "GPT-6.1 Sol"
    - name: "openrouter-gpt-6-1-terra"
      label: "GPT-6.1 Terra"
      iconURL: "/assets/openai-color.svg"
      group: "OpenAI"
      preset:
        endpoint: "OpenRouter"
        model: "openai/gpt-6.1-terra"
        modelLabel: "GPT-6.1 Terra"
    - name: "openrouter-gpt-5-6-luna"
      label: "GPT-5.6 Luna"
      iconURL: "/assets/openai-color.svg"
      group: "OpenAI"
      preset:
        endpoint: "OpenRouter"
        model: "openai/gpt-5.6-luna"
        modelLabel: "GPT-5.6 Luna"

    # Anthropic
    - name: "openrouter-claude-sonnet-5-5"
      label: "Claude Sonnet 5.5"
      iconURL: "/assets/anthropic.svg"
      group: "Anthropic"
      groupIcon: "anthropic"
      preset:
        endpoint: "OpenRouter"
        model: "anthropic/claude-sonnet-5.5"
        modelLabel: "Claude Sonnet 5.5"
    - name: "openrouter-claude-haiku-5-5"
      label: "Claude Haiku 5.5"
      iconURL: "/assets/anthropic.svg"
      group: "Anthropic"
      preset:
        endpoint: "OpenRouter"
