    # Google
    - name: "openrouter-gemini-3-8-flash"
      label: "Gemini 3.8 Flash"
      iconURL: "/assets/google.svg"
      group: "Google"
      groupIcon: "google"
      preset:
        endpoint: "OpenRouter"
