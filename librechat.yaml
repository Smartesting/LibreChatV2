    # Mistral AI
    - name: "openrouter-mistral-medium-3-5"
      label: "Mistral Medium 3.5"
      iconURL: "/assets/mistral.png"
      group: "Mistral"
      groupIcon: "assets/mistral.png"
      preset:
        endpoint: "OpenRouter"
        model: "mistralai/mistral-medium-3-5"
        modelLabel: "Mistral Medium 3.5"
    - name: "openrouter-mistral-small-2603"
      label: "Mistral Small 2603"
      iconURL: "/assets/mistral.png"
      group: "Mistral"
      preset:
